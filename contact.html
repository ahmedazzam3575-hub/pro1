<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Project</title>
    <link rel="stylesheet" href="stle.css">
</head>
<body>

    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Get in Touch</h2>
            <form action="#" method="post">
                
                <!-- 1. Text input -->
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <!-- 2. Email input -->
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <!-- 3. Number input -->
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="number" id="phone" name="phone">
                </div>

                <!-- 4. Date input -->
                <div class="form-group">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob">
                </div>

                <!-- 5. Radio buttons -->
                <div class="form-group">
                    <label>Gender:</label>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male" class="inline-label">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female" class="inline-label">Female</label>
                </div>

                <!-- 6. Checkboxes -->
                <div class="form-group">
                    <label>Interests:</label>
                    <input type="checkbox" id="web" name="interests" value="web">
                    <label for="web" class="inline-label">Web Development</label>
                    <input type="checkbox" id="design" name="interests" value="design">
                    <label for="design" class="inline-label">Design</label>
                </div>

                <!-- 7. Dropdown menu (Select) -->
                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <select id="subject" name="subject">
                        <option value="general">General Inquiry</option>
                        <option value="support">Technical Support</option>
                        <option value="feedback">Feedback</option>
                    </select>
                </div>

                <!-- 8. Large text box (Textarea) -->
                <div class="form-group">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 All Rights Reserved.</p>
    </footer>

</body>
</html>
